name: Release runtime

on:
  push:
    tags:
      # Only trigger on tags that follow the vMAJOR.MINOR.PATCH pattern.
      # Example: v0.3.0
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Prevent releasing a git tag that disagrees with pyproject.toml version.
  # Requires the tag to use the simple semantic-version shape:
  # vMAJOR.MINOR.PATCH, such as v0.3.0.
  # It rejects release-0.3.0, v0.3, and v0.3.0-beta.
  verify_revision:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out revision source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Verify release version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${GITHUB_REF_NAME#v}" = "$package_version"

  test:
    runs-on: ubuntu-24.04
    needs: verify_revision
    steps:
      - name: Check out revision source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install '.[test]'

      - name: Run tests
        run: python -m pytest -q

  publish:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out revision source
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        uses: docker/metadata-action@v6
        id: generate-image-metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/looping-louie-runtime
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.generate-image-metadata.outputs.tags }}
          labels: ${{ steps.generate-image-metadata.outputs.labels }}

  release:
    runs-on: ubuntu-24.04
    needs: publish
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
