name: Release runtime

on:
  push:
    tags:
      # Only trigger on tags that follow the vMAJOR.MINOR.PATCH pattern.
      # Example: v0.3.0
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Prevent releasing a git tag that disagrees with pyproject.toml version.
  # Requires the tag to use the simple semantic-version shape:
  # vMAJOR.MINOR.PATCH, such as v0.3.0.
  # It rejects release-0.3.0, v0.3, and v0.3.0-beta.
  verify_revision:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out revision source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Verify release version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${GITHUB_REF_NAME#v}" = "$package_version"

  test_source:
    runs-on: ubuntu-24.04
    needs: verify_revision
    steps:
      - name: Check out revision source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install '.[test]'

      - name: Run tests
        run: python -m pytest -q

  # Publishes platform-specific Docker images to GitHub Container Registry.
  publish_platform_images:
    needs: test_source
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out revision source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Creates the canonical OCI labels for the release. For example, for
      # v0.3.1 it would include labels like:
      #
      # org.opencontainers.image.version=0.3.1
      # org.opencontainers.image.revision=<Git commit SHA>
      # org.opencontainers.image.source=https://github.com/looping-louie/runtime
      - name: Generate image metadata
        uses: docker/metadata-action@v6
        id: generate-image-metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      # Creates unique image tags for the current matrix platform. For example,
      # for AMD64 and ARM64 platforms, version 0.3.1 would result in tags like:
      #
      # For AMD64:
      # :0.3.1-amd64
      # :sha-<commit>-amd64
      # :latest-amd64
      #
      # For ARM64:
      # :0.3.1-arm64
      # :sha-<commit>-arm64
      # :latest-arm64
      - name: Generate platform tags
        id: generate-platform-tags
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      # Publishes the generated platform-specific tags and labels. For example,
      # version 0.3.1 publishes images like:
      #
      # ghcr.io/<owner>/runtime:0.3.1-amd64
      # ghcr.io/<owner>/runtime:0.3.1-arm64
      # ghcr.io/<owner>/runtime:sha-<commit>-amd64
      # ghcr.io/<owner>/runtime:sha-<commit>-arm64
      # ghcr.io/<owner>/runtime:latest-amd64
      # ghcr.io/<owner>/runtime:latest-arm64
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.generate-platform-tags.outputs.tags }}
          labels: ${{ steps.generate-image-metadata.outputs.labels }}

  # Combines the two architecture-specific images into one public multi-platform
  # tag. For example,
  #
  # ghcr.io/looping-louie/runtime:0.3.1
  # ghcr.io/looping-louie/runtime:latest
  # ghcr.io/looping-louie/runtime:sha-<commit>
  merge_images:
    needs: publish_platform_images
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: generate-image-metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Merge platform images
        env:
          TAGS: ${{ steps.generate-image-metadata.outputs.tags }}
        run: |
          printf '%s\n' "$TAGS" | while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

  create_release:
    runs-on: ubuntu-24.04
    needs: merge_images
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
