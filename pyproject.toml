[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'looping-louie-runtime'
version = '0.0.0'
description = 'Runtime for the Looping Louie platform.'
requires-python = '>=3.12'
dependencies = [
	'httpx==0.28.*',
	'PyYAML==6.0.*',
]

[project.optional-dependencies]
test = [
	'pytest==9.1.*',
	'pytest-asyncio==1.3.*',
]

[project.scripts]
looping-louie-runtime = 'main:main'

[tool.setuptools]
package-dir = {'' = 'src'}
py-modules = [
	'activity_client',
	'api_client',
	'config',
	'executor',
	'file_operations',
	'main',
	'policy',
	'repository_context',
	'runner',
	'worker',
]

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
